[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ir-workbench"
version = "0.1.0"
description = "携程 IR 部门 AI 自动化工作台"
requires-python = ">=3.14"
dependencies = [
  "requests==2.34.2",
  "beautifulsoup4==4.15.0",
  "pdfplumber==0.11.10",
  "openpyxl==3.1.5",
  "python-docx==1.2.0",
  "pandas==3.0.4",
  "akshare==1.18.64",
  "yfinance==1.5.1",
  "markdown==3.10.2",
  "playwright==1.58.0",
  "pywin32==312; platform_system == 'Windows'",
]

[project.scripts]
ir = "workbench.cli:main"

[tool.setuptools.packages.find]
include = ["workbench*", "modules*"]
